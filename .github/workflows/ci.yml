name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch veltrio-core
        run: ./scripts/fetch-core.sh
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASES_TOKEN || github.token }}
      # Everything below switches on once the app project (project.yml,
      # XcodeGen) is committed.
      - name: Generate the Xcode project
        if: hashFiles('project.yml') != ''
        run: brew install xcodegen && xcodegen generate
      - name: Build
        if: hashFiles('project.yml') != ''
        run: |
          xcodebuild -project Veltrio.xcodeproj -scheme Veltrio \
            -destination "generic/platform=tvOS Simulator" build CODE_SIGNING_ALLOWED=NO
